# Azure Pipeline for RubberDuck
# Restore, build, test runs on all pushes, all branches
# SonarQube scan runs on pushes to main
# Deploy only runs on pushes to main

trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  webAppName: 'app-duckapi-gvfp64nsi3it6'

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: BuildAndTest
        displayName: Build and test
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - task: DotNetCoreCLI@2
            displayName: Restore packages
            inputs:
              command: restore
              projects: '**/*.csproj'

          - task: SonarCloudPrepare@4.2.6
            displayName: Sonar prepare
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              SonarCloud: 'sonarqube-cloud'
              organization: 'hjh-swe'
              scannerMode: 'dotnet'
              projectKey: 'hjh-swe_rubber-duck-api'

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: '**/*.csproj'
              arguments: '--configuration Release --no-restore'

          - task: DotNetCoreCLI@2
            displayName: Run tests
            inputs:
              command: test
              projects: 'tests/**/*.csproj'
              arguments: '--configuration Release --no-build'

          - task: SonarCloudAnalyze@4.2.6
            displayName: Sonar analysis
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              jdkversion: 'JAVA_HOME_21_X64'
          
          - task: SonarCloudPublish@4.2.6
            displayName: Sonar publish quality gate result
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              pollingTimeoutSec: '300'

          - task: DotNetCoreCLI@2
            displayName: Publish app
            inputs:
              command: publish
              publishWebProjects: false
              projects: 'src/RubberDuck/RubberDuck.csproj'
              arguments: '--configuration Release -r linux-x64 --self-contained false --output $(Build.ArtifactStagingDirectory)/Output'
              zipAfterPublish: true

          - task: PublishPipelineArtifact@1
            displayName: Upload build artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/Output'
              artifact: 'drop'
              publishLocation: 'pipeline'

  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployApp
        displayName: Deploy to App Service
        steps:
          - checkout: none

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to App Service
            inputs:
              azureSubscription: 'azure-rubberduck'
              appType: webAppLinux
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/*.zip'
